method: derived
source: mcp/unbounce-mcp-tools.json + openapi/*.yml + raml/unbounce-api-v0.4.raml
note: >-
  Binds Unbounce's 37 published MCP tools to the public REST surface. The two are
  overlapping-but-non-identical projections of one core: the public REST API v0.4 is
  read-only apart from lead creation, while MCP is the only public write surface for
  pages, variants, publishing, traffic and page groups. Live tools/list is OAuth-gated,
  so tool names, params and semantics come from Unbounce's own published tool reference;
  mappings are by documented semantics and are graded honestly.
surfaces:
  openapi:
    files:
    - openapi/unbounce-accounts-api-openapi.yml
    - openapi/unbounce-domains-api-openapi.yml
    - openapi/unbounce-leads-api-openapi.yml
    - openapi/unbounce-meta-api-openapi.yml
    - openapi/unbounce-pagegroups-api-openapi.yml
    - openapi/unbounce-pages-api-openapi.yml
    - openapi/unbounce-users-api-openapi.yml
    base_url: https://api.unbounce.com
    gated: false
    note: Public REST API v0.4; the provider-published contract is RAML 0.8 (raml/unbounce-api-v0.4.raml).
  graphql:
    endpoint: null
    note: Unbounce publishes no GraphQL surface.
  mcp:
    url: https://mcp.unbounce.com/mcp
    gated: true
    note: tools/list returns HTTP 401 invalid_token; OAuth (scope "unbounce") required for live introspection.
crosswalk:
- tool: whoami
  category: identity
  rest: [listUsers]
  binding: rest
  confidence: high
  note: >-
    Tool documentation states it "calls the Unbounce API on the caller's behalf"; the
    REST /users resource returns the authenticated user (RAML example users/self_get.json).
- tool: list_accounts_and_clients
  category: identity
  rest: [listAccounts, listSubAccountsForAccount]
  binding: rest
  confidence: high
  note: >-
    Fans out over two REST operations — accounts, then each account's sub-accounts
    ("clients" in Unbounce product language). Tool docs state it calls the Unbounce API.
- tool: list_client_pages
  category: pages
  rest: [listSubAccountPages, listPages]
  binding: rest
  confidence: medium
  note: >-
    Same collection, richer projection. The tool returns routing_strategy/routing_config
    and an unpublished-changes flag that the REST page schema does not expose, and it
    paginates with after/next_after rather than REST offset/limit.
- tool: list_page_groups
  category: page-groups
  rest: [listPageGroupsForSubAccount]
  binding: rest
  confidence: high
- tool: list_client_domains
  category: domains
  rest: [listDomainsForSubAccount]
  binding: rest
  confidence: high
- tool: get_page_stats
  category: stats
  rest: [listPages]
  binding: rest
  confidence: low
  note: >-
    REST only exposes page stats as a collection flag (GET /pages?with_stats=true) with
    no per-variant breakdown. The tool's variant-level visits/visitors/conversions/
    conversion_rate_delta/confidence and start_date/end_date windowing have no REST
    equivalent, so this is a partial binding at best.
