gaps:
- The error body carries no stable error code or type URI, so failures cannot be branched on programmatically without string-matching `message`.
- definitions_v3.1.json (the target of the published error schema's $ref) is not served, leaving the error schema unresolvable.
- No Retry-After or rate-limit headers accompany 429.
