- aid: unbounce:mcp-server
  name: Unbounce MCP Server
  description: >-
    Official hosted Model Context Protocol server for Unbounce. Exposes 37 tools that
    create, edit, publish, A/B-test and report on Unbounce landing pages and variants
    directly from an AI assistant. Authorization is OAuth 2.0 with PKCE and dynamic client
    registration; access is included on every Unbounce pricing plan. This is the only
    public write surface for pages and variants — the REST API is read-only apart from
    lead creation.
  humanURL: https://unbounce.com/product/mcp-server/
  baseURL: https://mcp.unbounce.com/mcp
