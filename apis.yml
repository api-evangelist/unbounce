aid: unbounce
name: Unbounce
description: >-
  Unbounce is a landing page, popup, and sticky bar builder with conversion
  rate optimization features including drag-and-drop design, A/B testing, AI
  copywriting (Smart Copy), and AI traffic routing (Smart Traffic) for
  marketers, agencies, SaaS, and ecommerce. The platform integrates with
  HubSpot, Salesforce, Google Analytics, and other marketing platforms to
  capture, qualify, and route leads. The Unbounce REST API provides programmatic
  access to pages, leads, sub-accounts, and domains using an API key over HTTP Basic
  or OAuth 2.0 Authorization Code, described by a published RAML 0.8 definition. Unbounce
  also operates an official hosted Model Context Protocol server at mcp.unbounce.com with
  37 tools — the only public write surface for pages, variants, publishing and traffic —
  plus three Agent Skills shipped in its own agent-plugin marketplace.
type: Index
accessModel:
  pricing: published
  onboarding: request-required
  trial: true
  trial_days: 14
  try_now: true
  public: false
  label: Published pricing, API access on request
  confidence: high
  source:
  - https://unbounce.com/pricing/
  - https://developer.unbounce.com/getting_started/
  - plans/unbounce-plans-pricing.yml
  note: >-
    Signing up for Unbounce is self-serve with a 14-day free trial, but API access is not:
    an API Access form must be approved by support before keys can be created, and OAuth
    client credentials are granted case-by-case. The MCP server is the one surface a user
    can authorize themselves. try_now refers to the RAML API Console, which runs against
    production data.
