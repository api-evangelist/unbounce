aid: unbounce
name: Unbounce
description: >-
  Unbounce is a landing page, popup, and sticky bar builder with conversion
  rate optimization features including drag-and-drop design, A/B testing, AI
  copywriting (Smart Copy), and AI traffic routing (Smart Traffic) for
  marketers, agencies, SaaS, and ecommerce. The platform integrates with
  HubSpot, Salesforce, Google Analytics, and other marketing platforms to
  capture, qualify, and route leads. The Unbounce REST API provides programmatic
  access to pages, leads, sub-accounts, and domains using OAuth 2.0
  Authorization Code flow.
type: Index
